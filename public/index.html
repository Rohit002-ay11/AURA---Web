<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AURA — AI Teacher</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand"><div class="mark">A</div><div><b>AURA</b><span>REALTIME AI TEACHER</span></div></div><div id="status">CONNECTING</div></header>
<main><section class="teacher"><div id="videoWrap"><video id="avatar" autoplay playsinline></video><div id="fallback"><div class="fallback-face"><div class="eyes"></div><div class="mouth"></div></div><div class="fallback-text">AURA is connecting…</div></div></div><div class="caption" id="caption">Your private classroom is starting.</div></section>
<section class="board"><div class="board-head"><span>LIVE TEACHING BOARD</span><span id="topic">READY</span></div><div id="cards"><div class="empty">AURA will place equations, diagrams and handwritten-style notes here while teaching.</div></div></section></main>
<footer><button id="start">Start class</button><button id="mic">🎙 Speak</button><input id="q" placeholder="Ask AURA anything…"><button id="send">Send</button></footer>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script><script src="/app.js"></script></body></html>
